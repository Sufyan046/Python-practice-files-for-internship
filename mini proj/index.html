<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Expense Tracker</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

    <h1>Expense Tracker</h1>

    <div class="balance-container">
        <h2>Balance: ₹<span id="balance">0</span></h2>
        <div class="summary">
            <div class="income">Income: ₹<span id="income">0</span></div>
            <div class="expense">Expense: ₹<span id="expense">0</span></div>
        </div>
    </div>

    <form id="transaction-form">
        <input type="text" id="text" placeholder="Description" required>
        <input type="number" id="amount" placeholder="Amount (+income, -expense)" required>
        <select id="category">
            <option value="Food">Food</option>
            <option value="Travel">Travel</option>
            <option value="Shopping">Shopping</option>
            <option value="Bills">Bills</option>
        </select>
        <button type="submit">Add Transaction</button>
    </form>

    <h3>Transactions</h3>
    <ul id="list"></ul>

    <div class="charts">
        <canvas id="pieChart"></canvas>
        <canvas id="barChart"></canvas>
    </div>

    <script src="script.js"></script>
</body>
</html>
